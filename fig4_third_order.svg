<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260">
<rect width="520" height="260" fill="white"/>
<text x="260" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="black" font-weight="normal">Fig. 4  Geometric intuition for the third-order expansion</text>
<circle cx="140.0" cy="130.0" r="14" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="140" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="black" font-weight="normal">Pf</text>
<circle cx="380.0" cy="130.0" r="14" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="380" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="black" font-weight="normal">Pb</text>
<line x1="150.0" y1="95.0" x2="370.0" y2="95.0" stroke="#1e8449" stroke-width="2"/>
<polygon points="370.0,95.0 362.0,91.0 362.0,99.0" fill="#1e8449"/>
<line x1="370.0" y1="80.0" x2="150.0" y2="80.0" stroke="#1e8449" stroke-width="2"/>
<polygon points="150.0,80.0 142.0,76.0 142.0,84.0" fill="#1e8449"/>
<text x="260" y="65" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1e8449" font-weight="normal">2nd order: same round-trip distance (Fisher metric); cancels on subtraction</text>
<line x1="150.0" y1="165.0" x2="370.0" y2="165.0" stroke="#c0392b" stroke-width="2"/>
<polygon points="370.0,165.0 362.0,161.0 362.0,169.0" fill="#c0392b"/>
<line x1="370.0" y1="180.0" x2="180.0" y2="180.0" stroke="#c0392b" stroke-width="1.2"/>
<polygon points="180.0,180.0 172.0,176.0 172.0,184.0" fill="#c0392b"/>
<text x="260" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="normal">3rd order: different round trips (Amari-Chentsov tensor); directionality lives here</text>
<text x="260" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">Caption: top - second-order term round-trip symmetric, cancels; bottom - third-order term asymmetric, source of directionality</text>
</svg>
